# Example HPA for the edge Deployment (--role=edge), driven by the real
# keel_edge_load_score custom metric instead of the paper formula in the
# design doc. Adjust scaleTargetRef.name/namespace and minReplicas/
# maxReplicas/averageValue to the actual deployment before applying.
#
# Prerequisites: custom.metrics.k8s.io must be serving keel_edge_load_score
# — see deploy/k8s/prometheus-adapter-config.yaml's doc comment. Without a
# working adapter, this HPA is created successfully but shows
# `<unknown>`/FailedGetPodsMetric events forever; validated so far only via
# `kubectl apply --dry-run` (see design doc Fase 2), not against a live
# adapter.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: keel-gateway-edge
  namespace: keel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: keel-gateway-edge
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: keel_edge_load_score
        target:
          type: AverageValue
          # 0-1 score, expressed as a milli-quantity: 700m == 0.7 target.
          averageValue: "700m"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Long cooldown per design doc ("cooldown lungo per lo scale-down") —
      # edge pods are cheap to add under a load spike but a premature
      # scale-down right after a reconnect storm subsides would just cause
      # another one on the next spike.
      stabilizationWindowSeconds: 900
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
