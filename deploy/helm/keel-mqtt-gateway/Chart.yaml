apiVersion: v2
name: keel-mqtt-gateway
description: >-
  Custom MQTT clustering gateway (core/edge split, hashicorp/raft +
  memberlist + Olric). PostgreSQL and Redpanda/Kafka are always treated
  as external, pre-existing services (see values.yaml's
  postgresql.external / redpanda.external /
  outputConnector.kafkaHono.external) — this chart never bundles or
  deploys them itself.
type: application
