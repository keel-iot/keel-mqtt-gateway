{{/*
Chart-managed fallback Secret: one key per external dependency that has
an inline password/saslPassword set AND no existingSecret configured.
Local/dev convenience only — production should always set the relevant
existingSecret instead (see values.yaml's comments on each dependency).
Nothing is rendered here for a dependency using existingSecret; that
Secret is assumed to already exist and is referenced directly.
*/}}
{{- $needsSecret := false }}
{{- if and (not .Values.postgresql.external.existingSecret) .Values.postgresql.external.password }}{{ $needsSecret = true }}{{- end }}
{{- if and .Values.redpanda.enabled (not .Values.redpanda.external.existingSecret) .Values.redpanda.external.saslPassword }}{{ $needsSecret = true }}{{- end }}
{{- if and .Values.outputConnector.kafkaHono.enabled (not .Values.outputConnector.kafkaHono.external.existingSecret) .Values.outputConnector.kafkaHono.external.saslPassword }}{{ $needsSecret = true }}{{- end }}
{{- if .Values.core.redis.password }}{{ $needsSecret = true }}{{- end }}
{{- if $needsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keel.generatedSecretName" . }}
  labels:
    {{- include "keel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.postgresql.external.existingSecret) .Values.postgresql.external.password }}
  postgresql-password: {{ .Values.postgresql.external.password | quote }}
  {{- end }}
  {{- if and .Values.redpanda.enabled (not .Values.redpanda.external.existingSecret) .Values.redpanda.external.saslPassword }}
  redpanda-sasl-password: {{ .Values.redpanda.external.saslPassword | quote }}
  {{- end }}
  {{- if and .Values.outputConnector.kafkaHono.enabled (not .Values.outputConnector.kafkaHono.external.existingSecret) .Values.outputConnector.kafkaHono.external.saslPassword }}
  kafka-hono-sasl-password: {{ .Values.outputConnector.kafkaHono.external.saslPassword | quote }}
  {{- end }}
  {{- if .Values.core.redis.password }}
  redis-password: {{ .Values.core.redis.password | quote }}
  {{- end }}
{{- end }}
