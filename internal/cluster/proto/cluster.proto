syntax = "proto3";

package keel.cluster;

option go_package = "github.com/keel-iot/keel-mqtt-gateway/internal/cluster/proto/clusterpb";

// Registry is called by edge nodes to reach the raft-backed Registry that
// lives on core nodes. Core nodes call their local LocalRegistry directly
// and never go through this RPC.
service Registry {
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
  rpc NodesFor(NodesForRequest) returns (NodesForResponse);
  rpc ClaimSession(ClaimSessionRequest) returns (ClaimSessionResponse);
  rpc ReleaseSession(ReleaseSessionRequest) returns (ReleaseSessionResponse);
  // EvaluateACL is a read: any core node's FSM state is fail-closed-safe
  // to consult even if lagging slightly behind the leader (see
  // internal/cluster/acl and raft.LocalRegistry.EvaluateACL), so — like
  // NodesFor — it does not require reaching the leader specifically.
  rpc EvaluateACL(EvaluateACLRequest) returns (EvaluateACLResponse);

  // ACLSnapshot is a read, same fail-closed-safe rationale as EvaluateACL
  // above — used by edge nodes to populate/refresh a local ACL cache
  // (internal/cluster/raft.ACLCache) instead of round-tripping
  // EvaluateACL to a core node on every publish/subscribe.
  rpc ACLSnapshot(ACLSnapshotRequest) returns (ACLSnapshotResponse);

  // CurrentRedisPrimary is a read, same fail-closed-safe/any-peer
  // rationale as EvaluateACL/NodesFor — "who is the co-located Redis
  // primary" is decided via raft.Apply (see internal/cluster/raft's
  // OpSetRedisPrimary), not gossip, specifically so a leadership change
  // mid-failover can't cause two nodes to disagree; but READING that
  // decision never requires the leader specifically, same as any other
  // FSM read here. Used by every node running a
  // internal/cluster/redisrouter.Router (both core and edge) to redirect
  // to a new primary's address after a failover.
  rpc CurrentRedisPrimary(CurrentRedisPrimaryRequest) returns (CurrentRedisPrimaryResponse);

  // ACL mutation RPCs. Only used core-to-core, when a non-leader core node
  // forwards a management-API-originated write to the current leader (the
  // same fallback path ClaimSession/ReleaseSession already use) — edge
  // nodes never call these directly, since internal/cluster/management is
  // only mounted on core nodes and the CLI/API always targets a core
  // address.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc CreateBinding(CreateBindingRequest) returns (CreateBindingResponse);
  rpc DeleteBinding(DeleteBindingRequest) returns (DeleteBindingResponse);
  rpc EnableRuleset(EnableRulesetRequest) returns (EnableRulesetResponse);
  rpc DisableRuleset(DisableRulesetRequest) returns (DisableRulesetResponse);

  // RevokeCertificate is a write (same leader-only rationale as the ACL
  // mutations above) — records identity ("<deviceID>@<tenantID>", matches
  // the device cert's CN) as revoked. Called by the management API's
  // revocation webhook handler (see internal/cluster/management), itself
  // fed by an external custodian's revocation event (e.g. Clavex's
  // device.cert.revoked).
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse);
  // IsRevoked is a single-identity read, same fail-closed-on-transport-
  // -error rationale as EvaluateACL (an unreachable cluster must never
  // read as "not revoked"). Mirrors EvaluateACL/ACLSnapshot's split: this
  // is the live single-check RPC, RevocationSnapshot below is the bulk
  // fetch used to populate/refresh a local cache.
  rpc IsRevoked(IsRevokedRequest) returns (IsRevokedResponse);
  // RevocationSnapshot is a read, same fail-closed-safe/any-peer
  // rationale as ACLSnapshot — used by every node (core and edge) to
  // populate/refresh a local revocation cache
  // (internal/cluster/raft.RevocationCache) instead of round-tripping
  // this RPC on every connect.
  rpc RevocationSnapshot(RevocationSnapshotRequest) returns (RevocationSnapshotResponse);
}

message SubscribeRequest {
  string topic = 1;
  string node_id = 2;
}
message SubscribeResponse {}

message UnsubscribeRequest {
  string topic = 1;
  string node_id = 2;
}
message UnsubscribeResponse {}

message NodesForRequest {
  string topic = 1;
  // local_node_id is the caller's own node ID. For a shared-subscription
  // group ($share/group/filter) whose only match is a local client on
  // this node, the caller already gets the message via its own local
  // mochi-mqtt delivery — so the registry excludes it from the returned
  // set and, if the group has other members, picks exactly one of those
  // instead, to preserve exactly-once delivery per group.
  string local_node_id = 2;
}
message NodesForResponse {
  repeated string node_ids = 1;
}

message ClaimSessionRequest {
  string client_id = 1;
  string node_id = 2;
}
message ClaimSessionResponse {
  bool ok = 1;
  // evicted_node_id is the previous owner's node ID when the claim took
  // the session over from a different node, empty otherwise — see
  // raft.Registry.ClaimSession's doc.
  string evicted_node_id = 2;
}

message ReleaseSessionRequest {
  string client_id = 1;
  string node_id = 2;
}
message ReleaseSessionResponse {}

message EvaluateACLRequest {
  string client_id = 1;
  string username = 2;
  string topic = 3;
  string action = 4; // "publish" | "subscribe"
}
message EvaluateACLResponse {
  bool allowed = 1;
  // matched_filter is the topic filter of the rule that decided the
  // outcome, empty when the decision was the fail-closed default (no
  // rule matched). Carried across the wire for audit/debugging parity
  // with acl.Decision on the core side.
  string matched_filter = 2;
}

message ACLRule {
  string topic_filter = 1;
  repeated string actions = 2;
  string effect = 3; // "allow" | "deny"
}

message ACLSnapshotRequest {}

message RoleEntry {
  string name = 1;
  repeated ACLRule rules = 2;
}
message BindingEntry {
  string principal = 1;
  repeated string role_names = 2;
}
message ACLSnapshotResponse {
  repeated RoleEntry roles = 1;
  repeated BindingEntry bindings = 2;
  repeated string enabled_rulesets = 3;
}

message CurrentRedisPrimaryRequest {}
message CurrentRedisPrimaryResponse {
  string node_id = 1;
  bool ok = 2; // false when no primary has ever been designated yet
}

message CreateRoleRequest {
  string name = 1;
  repeated ACLRule rules = 2;
}
message CreateRoleResponse {}

message DeleteRoleRequest {
  string name = 1;
}
message DeleteRoleResponse {}

message CreateBindingRequest {
  string principal = 1;
  string role_name = 2;
}
message CreateBindingResponse {}

message DeleteBindingRequest {
  string principal = 1;
  string role_name = 2;
}
message DeleteBindingResponse {}

message EnableRulesetRequest {
  string name = 1;
}
message EnableRulesetResponse {}

message DisableRulesetRequest {
  string name = 1;
}
message DisableRulesetResponse {}

message RevokeCertificateRequest {
  string identity = 1; // "<deviceID>@<tenantID>", matches cert CN
  string serial = 2;   // audit/reference only, not used for the deny-list lookup itself
}
message RevokeCertificateResponse {}

message IsRevokedRequest {
  string identity = 1;
}
message IsRevokedResponse {
  bool revoked = 1;
}

message RevocationSnapshotRequest {}
message RevocationSnapshotResponse {
  // revoked_identities -> unix seconds the revocation was recorded, for
  // audit/debugging parity with the FSM's own state.
  map<string, int64> revoked_identities = 1;
}

// Dataplane carries MQTT message payloads directly between nodes,
// point-to-point, kept off the raft log entirely. This is the phase-1
// implementation of internal/cluster/dataplane.Forwarder; a future
// implementation may replace it with embedded NATS without changing the
// Forwarder interface.
service Dataplane {
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  // Evict tells the receiving node to locally disconnect clientID — sent
  // by the node that just won a ClaimSession takeover, to the node that
  // previously owned the session (see internal/broker/hooks.go's
  // OnConnectAuthenticate). Best-effort: the caller does not block the
  // new connection on this succeeding: the evicted node's own MQTT
  // keepalive/TCP timeout is the backstop if this RPC is lost.
  rpc Evict(EvictRequest) returns (EvictResponse);
}

message ForwardRequest {
  string source_node_id = 1;
  string tenant_id = 2;
  string topic = 3;
  bytes payload = 4;
  uint32 qos = 5;
  // publish_id identifies this MQTT PUBLISH event, not its content —
  // generated once by the node that received it from mochi-mqtt, never
  // regenerated by a forward. Internal to Keel's own dedup, not an MQTT
  // protocol field.
  string publish_id = 6;
}
message ForwardResponse {}

message EvictRequest {
  string client_id = 1;
}
message EvictResponse {}
