# 3-node all-in-one cluster (--role=combined) for manually validating
# internal/cluster (see deploy/docker-compose/README.md for the
# step-by-step test scenarios: bootstrap, late join, voluntary drain +
# rejoin, cross-node routing-table replication). Each node runs a raft
# voter + embedded Olric member (core duties) AND the MQTT broker/HTTP
# adapter/commander (edge duties) in one process — the minimal PoC
# deployment with no dedicated edge tier. See docker-compose.core-edge-split.yml
# for the split topology instead.
#
# No Redpanda (commander/forwarder degrade to no-ops without
# REDPANDA_BROKERS — fine, this compose file is about raft/gossip/dataplane,
# not the Redpanda integration, which is unchanged from today's gateway).
name: keel-mqtt-cluster-poc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keel_devices
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

  core-1:
    build: .
    image: keel-mqtt-cluster:dev
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/keel_devices?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      AUTH_BACKEND: "file"
      CREDENTIAL_FILE: "/etc/keel/credentials.yaml"
      CREDENTIAL_CACHE_TTL: "${CREDENTIAL_CACHE_TTL:-30s}"
      LOG_LEVEL: "debug"
    volumes:
      - ./deploy/docker-compose/credentials.yaml:/etc/keel/credentials.yaml:ro
      - core-1-data:/data
    command:
      - "--role=combined"
      - "--node-id=core-1"
      - "--bootstrap=true"
      - "--raft-bind=core-1:7000"
      - "--raft-data-dir=/data/raft"
      - "--gossip-bind=0.0.0.0"
      - "--gossip-port=7946"
      - "--gossip-advertise=core-1"
      # Same sibling peer list every node gets — needed so core-1 can
      # rejoin gossip on its own after a drain+restart, not just be
      # (re)discovered passively. --bootstrap only matters on a genuinely
      # empty raft log (see raft.Node.Bootstrap), so it's safe to leave on
      # for every restart of this node.
      - "--gossip-peers=core-2:7946,core-3:7946"
      - "--grpc-bind=0.0.0.0:7100"
      - "--grpc-advertise=core-1:7100"
      - "--management-addr=0.0.0.0:8090"
      - "--olric-bind=0.0.0.0"
      - "--olric-port=7300"
      - "--olric-gossip-port=7301"
      - "--olric-advertise=core-1"
    ports:
      - "11883:1883"
      - "18090:8090"

  core-2:
    build: .
    image: keel-mqtt-cluster:dev
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
      core-1:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/keel_devices?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      AUTH_BACKEND: "file"
      CREDENTIAL_FILE: "/etc/keel/credentials.yaml"
      CREDENTIAL_CACHE_TTL: "${CREDENTIAL_CACHE_TTL:-30s}"
      LOG_LEVEL: "debug"
    volumes:
      - ./deploy/docker-compose/credentials.yaml:/etc/keel/credentials.yaml:ro
      - core-2-data:/data
    command:
      - "--role=combined"
      - "--node-id=core-2"
      - "--raft-bind=core-2:7000"
      - "--raft-data-dir=/data/raft"
      - "--gossip-bind=0.0.0.0"
      - "--gossip-port=7946"
      - "--gossip-advertise=core-2"
      - "--gossip-peers=core-1:7946"
      - "--grpc-bind=0.0.0.0:7100"
      - "--grpc-advertise=core-2:7100"
      - "--management-addr=0.0.0.0:8090"
      - "--olric-bind=0.0.0.0"
      - "--olric-port=7300"
      - "--olric-gossip-port=7301"
      - "--olric-advertise=core-2"
    ports:
      - "21883:1883"
      - "28090:8090"
      - "27100:7100" # debug only: lets a host-side gRPC client hit this node's dataplane/registry service directly

  core-3:
    build: .
    image: keel-mqtt-cluster:dev
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
      core-1:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/keel_devices?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      AUTH_BACKEND: "file"
      CREDENTIAL_FILE: "/etc/keel/credentials.yaml"
      CREDENTIAL_CACHE_TTL: "${CREDENTIAL_CACHE_TTL:-30s}"
      LOG_LEVEL: "debug"
    volumes:
      - ./deploy/docker-compose/credentials.yaml:/etc/keel/credentials.yaml:ro
      - core-3-data:/data
    command:
      - "--role=combined"
      - "--node-id=core-3"
      - "--raft-bind=core-3:7000"
      - "--raft-data-dir=/data/raft"
      - "--gossip-bind=0.0.0.0"
      - "--gossip-port=7946"
      - "--gossip-advertise=core-3"
      - "--gossip-peers=core-1:7946"
      - "--grpc-bind=0.0.0.0:7100"
      - "--grpc-advertise=core-3:7100"
      - "--management-addr=0.0.0.0:8090"
      - "--olric-bind=0.0.0.0"
      - "--olric-port=7300"
      - "--olric-gossip-port=7301"
      - "--olric-advertise=core-3"
    ports:
      - "31883:1883"
      - "38090:8090"

volumes:
  core-1-data:
  core-2-data:
  core-3-data:
